<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="sky2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5a86b8"/>
      <stop offset="100%" stop-color="#cfe0ec"/>
    </linearGradient>
    <linearGradient id="wall2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7a828c"/>
      <stop offset="100%" stop-color="#9aa3ac"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="800" height="500" fill="url(#sky2)"/>

  <!-- distant valley view (depth cue for height) -->
  <rect x="0" y="330" width="800" height="170" fill="#8fae6b" opacity="0.6"/>
  <rect x="0" y="330" width="800" height="20" fill="#c9d6bd" opacity="0.5"/>

  <!-- concrete wall filling most of view (climbing surface, first person) -->
  <rect x="0" y="0" width="800" height="380" fill="url(#wall2)"/>
  <g stroke="#5c636b" stroke-width="2" opacity="0.5">
    <line x1="0" y1="90" x2="800" y2="90"/>
    <line x1="0" y1="180" x2="800" y2="180"/>
    <line x1="0" y1="270" x2="800" y2="270"/>
  </g>

  <!-- climbing holds -->
  <g fill="#e0663b">
    <circle cx="600" cy="120" r="16"/>
    <circle cx="220" cy="150" r="14"/>
    <circle cx="480" cy="240" r="15"/>
    <circle cx="150" cy="280" r="13"/>
    <circle cx="650" cy="300" r="14"/>
  </g>

  <!-- first-person VR hands/controllers reaching -->
  <g>
    <rect x="440" y="330" width="26" height="70" rx="10" fill="#1c1f24" transform="rotate(-18 453 365)"/>
    <circle cx="480" cy="250" r="20" fill="#f2c29a"/>
    <rect x="260" y="340" width="26" height="70" rx="10" fill="#1c1f24" transform="rotate(15 273 375)"/>
    <circle cx="222" cy="160" r="20" fill="#f2c29a"/>
  </g>

  <!-- floating historical info panel -->
  <rect x="500" y="60" width="260" height="150" rx="10" fill="#0f172a" opacity="0.88"/>
  <rect x="514" y="74" width="90" height="60" rx="4" fill="#c7b299"/>
  <g stroke="#8a7660" stroke-width="2">
    <line x1="514" y1="90" x2="604" y2="90"/>
    <line x1="530" y1="74" x2="530" y2="134"/>
  </g>
  <text x="616" y="88" font-family="Arial, sans-serif" font-size="13" fill="#ffd166">1955</text>
  <text x="616" y="106" font-family="Arial, sans-serif" font-size="11" fill="#ffffff">Začetek gradnje</text>
  <text x="616" y="122" font-family="Arial, sans-serif" font-size="11" fill="#ffffff">termoelektrarne</text>
  <text x="514" y="160" font-family="Arial, sans-serif" font-size="11" fill="#cbd5e1">Prva enota je stekla</text>
  <text x="514" y="176" font-family="Arial, sans-serif" font-size="11" fill="#cbd5e1">leta 1956 in oskrbovala</text>
  <text x="514" y="192" font-family="Arial, sans-serif" font-size="11" fill="#cbd5e1">Šaleško dolino z energijo.</text>

  <!-- progress HUD -->
  <rect x="20" y="20" width="220" height="30" rx="6" fill="#000000" opacity="0.5"/>
  <rect x="24" y="24" width="150" height="10" rx="5" fill="#4ade80"/>
  <text x="184" y="41" font-family="Arial, sans-serif" font-size="11" fill="#ffffff">55%</text>
</svg>
