<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="sky1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a6ea5"/>
      <stop offset="60%" stop-color="#a9c9e0"/>
      <stop offset="100%" stop-color="#d9e6ef"/>
    </linearGradient>
    <linearGradient id="tower1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5b6570"/>
      <stop offset="50%" stop-color="#8b95a0"/>
      <stop offset="100%" stop-color="#4a525c"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="800" height="500" fill="url(#sky1)"/>

  <!-- clouds -->
  <g fill="#ffffff" opacity="0.8">
    <ellipse cx="130" cy="80" rx="60" ry="18"/>
    <ellipse cx="170" cy="70" rx="40" ry="14"/>
    <ellipse cx="650" cy="60" rx="55" ry="16"/>
  </g>

  <!-- ground -->
  <rect x="0" y="430" width="800" height="70" fill="#6b7a4a"/>
  <rect x="0" y="420" width="800" height="15" fill="#82914f"/>

  <!-- cooling tower hyperboloid shape -->
  <path d="M 300 60 C 260 220, 260 300, 320 430 L 480 430 C 540 300, 540 220, 500 60 Z" fill="url(#tower1)" stroke="#3a4148" stroke-width="2"/>
  <ellipse cx="400" cy="60" rx="100" ry="16" fill="#6b7580"/>
  <ellipse cx="400" cy="430" rx="100" ry="18" fill="#3a4148"/>

  <!-- steam from top -->
  <g fill="#ffffff" opacity="0.55">
    <ellipse cx="400" cy="35" rx="55" ry="20"/>
    <ellipse cx="420" cy="10" rx="45" ry="18"/>
  </g>

  <!-- climbing ladder marks on tower -->
  <g stroke="#2c3238" stroke-width="2" opacity="0.6">
    <line x1="330" y1="420" x2="470" y2="420"/>
    <line x1="335" y1="380" x2="465" y2="380"/>
    <line x1="340" y1="340" x2="460" y2="340"/>
    <line x1="345" y1="300" x2="455" y2="300"/>
  </g>

  <!-- info sign near base -->
  <rect x="560" y="360" width="140" height="70" rx="6" fill="#1f2937" opacity="0.85"/>
  <text x="630" y="388" font-family="Arial, sans-serif" font-size="14" fill="#ffd166" text-anchor="middle">ZGODOVINA</text>
  <text x="630" y="408" font-family="Arial, sans-serif" font-size="12" fill="#ffffff" text-anchor="middle">TEŠ od 1955</text>
  <text x="630" y="422" font-family="Arial, sans-serif" font-size="10" fill="#cbd5e1" text-anchor="middle">poglej za info</text>

  <!-- VR user silhouette (first person hands) -->
  <g>
    <circle cx="400" cy="470" r="0" fill="none"/>
  </g>
  <g fill="#222" opacity="0.85">
    <ellipse cx="150" cy="465" rx="28" ry="18"/>
    <ellipse cx="120" cy="480" rx="10" ry="10"/>
  </g>

  <!-- HUD overlay hint -->
  <rect x="20" y="20" width="230" height="40" rx="8" fill="#000000" opacity="0.55"/>
  <text x="35" y="45" font-family="Arial, sans-serif" font-size="15" fill="#ffffff">▲ Pojdi bliže za začetek vzpona</text>
</svg>
